<style>
:root{--navy:#17364F;--navy2:#22506f;--ink:#1d2430;--mut:#6b7380;--line:#e3e7ec;--bg:#f4f6f8;--ok:#1f8a4c;--okb:#e7f5ec;--bad:#c0392b;--badb:#fdecea;--warn:#b7791f;--warnb:#fdf5e6;--card:#fff}

.logo{display:flex;align-items:center;gap:10px}.logo .m{width:34px;height:34px;border-radius:8px;background:#e8b04a;color:var(--navy);display:grid;place-items:center;font-weight:700}

nav{background:#fff;border-bottom:1px solid var(--line);padding:0 22px;display:flex;gap:4px;overflow-x:auto}
nav button{border:0;background:none;padding:13px 14px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--navy);border-color:#e8b04a}
main{padding:18px 22px;max-width:1280px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:15px}
.row{display:flex;align-items:center}.wrap{flex-wrap:wrap}.gap{gap:10px}.mt{margin-top:12px}
label{font-weight:500}select{font:inherit;padding:6px 8px;border-radius:7px;border:1px solid var(--line);margin-left:6px}

.seg.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.b{display:inline-block;min-width:20px;padding:0 6px;border-radius:9px;background:#eef1f4;color:var(--ink);font-size:11px;font-weight:700;text-align:center}.seg.on .b{background:#fff}
.b.ok{background:var(--okb);color:var(--ok)}.b.bad{background:var(--badb);color:var(--bad)}.b.warn{background:var(--warnb);color:var(--warn)}

.filemeta{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-bottom:8px}
.banner{padding:9px 12px;border-radius:8px;font-weight:500}.banner.ok{background:var(--okb);color:var(--ok)}.banner.bad{background:var(--badb);color:var(--bad)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px;max-height:560px}
table.grid{border-collapse:collapse;width:100%}.grid th{position:sticky;top:0;background:var(--navy);color:#fff;text-align:left;font-weight:600;font-size:12px;padding:8px 10px;white-space:nowrap}
.grid td{border-top:1px solid var(--line);padding:7px 10px;vertical-align:top}.grid tr:nth-child(even) td{background:#fafbfc}
.grid tr.rbad td{background:#fff7f6}.num{text-align:right}

.tok{color:var(--ok)}.tbad{color:var(--bad)}.twarn{color:var(--warn)}

.chk{display:flex;gap:6px;align-items:center}

.params{columns:2;font-size:13px}.params li{margin:3px 0}

#toast.show{transform:translateX(-50%);opacity:1}#toast.ok{background:var(--ok)}#toast.bad{background:var(--bad)}

function montos(r, empId) {
  const w = maestroDe(empId).find(x => x.dni === r.dni);
  const sueldo = w ? w.sueldo : Number(r.sueldo) || 0, asig = w ? w.asigFam : 0;
  const vh = (sueldo + asig) / 240;
  return { h25: r2(vh * 1.25 * (Number(r.he25) || 0)), h35: r2(vh * 1.35 * (Number(r.he35) || 0)), bono: r2(Number(r.bono) || 0), mov: r2(Number(r.mov) || 0), falt: r2(sueldo / 30 * (Number(r.faltas) || 0)), vac: r2((sueldo + asig) / 30 * (Number(r.vac) || 0)), dm: r2((sueldo + asig) / 30 * (Number(r.dm) || 0)), ficha: w ? w.ficha : '' };
}
function sinSueldo(empId) {
  const nov = Store.get(empId).novedades; if (!nov) return [];
  const M = maestroDe(empId);
  return nov.rows.filter(r => !M.some(w => w.dni === r.dni) && !(Number(r.sueldo) > 0) && (Number(r.he25) || Number(r.he35) || Number(r.vac) || Number(r.dm) || Number(r.faltas)));
}
function comprobantes(empId) {

  nov.rows.filter(r => r.movimiento !== 'ALTA' || maestroDe(empId).some(w => w.dni === r.dni) || !maestroDe(empId).length).forEach(r => {

  return out;
}

  return `<div class="login card"><div class="logo big"><div class="m">SI</div><div><b>Smart-Input Dragon</b><small>${t.sub}</small></div></div>
    <form id="fLogin" class="mt"><label class="blk">${t.usuario}<input id="lu" autocomplete="username" required></label><label class="blk">${t.clave}<input id="lp" type="password" autocomplete="current-password" required></label>
    <div id="lerr" class="tbad small"></div><button class="btn primary wide mt">${t.entrar}</button></form>
    <details class="mt small"><summary>${lang === 'en' ? 'Test accounts' : lang === 'zh' ? '测试账号' : 'Cuentas de prueba'}</summary><table class="grid sm mt"><thead><tr><th>Rol</th><th>Usuario</th><th>Contraseña</th></tr></thead><tbody>
    ${ACCOUNTS.filter(a => !Store.api || (a.rol !== 'admin' && !(a.emp && EMP[a.emp].real))).map(a => `<tr><td>${a.rol === 'admin' ? 'Administrador (planillero)' : 'Cliente · ' + esc(a.nombre)}</td><td class="mono">${a.u}</td><td class="mono">${a.p}</td></tr>`).join('')}</tbody></table>
    <p class="muted">Cuentas de demostración del prototipo.${Store.api ? ' La cuenta de administrador y la de Alfa tienen contraseñas privadas.' : ''}</p></details>${Store.apiError ? `<div class="banner warn mt small">${esc(Store.apiError)}</div>` : !Store.api && Store.mode === 'local' && Store.ready ? `<div class="banner warn mt small">Modo local: sin servidor, los datos se guardan solo en este navegador.</div>` : ''}</div>`;
}
function render() {
  const ae = document.activeElement; const focusKey = ae && ae.dataset && ae.dataset.k ? [ae.dataset.i, ae.dataset.k, ae.selectionStart] : null;
  document.documentElement.lang = lang;
  $('#sub').textContent = T().sub;
  $('#who').innerHTML = SES ? `${esc(SES.nombre)} · <span class="rol">${SES.rol === 'admin' ? 'Administrador' : 'Cliente'}</span>` : '';
  $('#bSalir').textContent = T().salir; $('#bSalir').classList.toggle('hidden', !SES);
  $('#selLang').classList.toggle('hidden', !!(SES && SES.rol === 'admin'));
  const nav = $('#nav');
  if (SES && SES.rol === 'admin') { nav.classList.remove('hidden'); nav.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === UI.tab)); } else nav.classList.add('hidden');
  let html;
  if (!SES) html = vLogin();
  else if (!Store.ready) html = `<div class="card muted" id="dbnote">Cargando datos…</div>`;
  else if (SES.rol === 'cliente') html = vCliente();
  else html = { tablero: vTablero, novedades: vNovedades, validacion: vValidacion }[UI.tab]();
  $('#main').innerHTML = html; bind();
  if (focusKey) { const el = document.querySelector(`[data-i="${focusKey[0]}"][data-k="${focusKey[1]}"]`); if (el) { el.focus(); try { el.setSelectionRange(focusKey[2], focusKey[2]); } catch (e) { } } }
}
function bind() {
  const fl = $('#fLogin'); if (fl) fl.onsubmit = async ev => {
    ev.preventDefault(); const btn = fl.querySelector('button'); btn.disabled = true;
    await Store.init();
    let a = null; try { a = await Store.login($('#lu').value.trim().toLowerCase(), $('#lp').value); } catch (e) { a = null; $('#lerr').textContent = e.message || T().badLogin; btn.disabled = false; return; }
    btn.disabled = false;
    if (!a) { $('#lerr').textContent = T().badLogin; return; }
    SES = a; UI.grid = null; UI.upload = null; UI.tab = 'tablero'; if (a.emp) lang = EMP[a.emp].idioma; $('#selLang').value = lang;
    try { sessionStorage.setItem('sid2:ses', JSON.stringify({ u: a.u })); } catch (e) { }
    if (Store.api) { Store.ready = false; render(); await Store.load(); } else render();
  };
  const se = $('#selEmp'); if (se) se.onchange = ev => { UI.emp = ev.target.value; render(); };
  // cliente
  const bf = $('#bFormato'); if (bf) bf.onclick = bajarFormato;
  const fn = $('#fNov'); if (fn) fn.onchange = ev => { if (ev.target.files[0]) onUploadNov(ev.target.files[0]); ev.target.value = ''; };
  document.querySelectorAll('table.form input, table.form select').forEach(el => {
    const h = () => { const r = UI.grid[+el.dataset.i]; const k = el.dataset.k; let v = el.value; if (['dias', 'faltas', 'vac', 'dm', 'he25', 'he35', 'bono', 'mov', 'sueldo'].includes(k)) v = num(v); if (k === 'dni') v = String(v).trim(); if (r[k] !== v) { r[k] = v; UI.gridDirty = true; } };
    if (el.tagName === 'SELECT') el.onchange = () => { h(); render(); }; else { el.oninput = h; el.onchange = () => { h(); render(); }; el.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); el.blur(); } }; }
  });
  const ba = $('#bAlta'); if (ba) ba.onclick = () => { UI.grid.push({ dni: '', ficha: '', nombre: '', dias: '', faltas: 0, vac: 0, dm: 0, he25: 0, he35: 0, bono: 0, mov: 0, movimiento: maestroDe(SES.emp).length ? 'ALTA' : '', fecha: '', sueldo: '', obs: '' }); UI.gridDirty = true; render(); };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { UI.grid.splice(+b.dataset.del, 1); UI.gridDirty = true; render(); });
  const be = $('#bEnviar'); if (be) be.onclick = enviarNov;
  // admin
  const fm = $('#fMaestro'); if (fm) fm.onchange = ev => { if (ev.target.files[0]) onUploadMaestro(ev.target.files[0]); ev.target.value = ''; };
  const bnc = $('#bNovCli'); if (bnc) bnc.onclick = () => bajarNovCliente(UI.emp);
  const bc = $('#bComp'); if (bc) bc.onclick = () => bajarComprobantes(UI.emp);
  document.querySelectorAll('[data-rep]').forEach(i => i.onchange = ev => { if (ev.target.files[0]) onUploadRep(ev.target.files[0], i.dataset.rep); ev.target.value = ''; });
  document.querySelectorAll('[data-mapsheet]').forEach(s => s.onchange = () => { TMP[UI.emp + s.dataset.mapsheet].si = +s.value; UI.map[UI.emp + s.dataset.mapsheet] = { hi: 0 }; render(); });
  document.querySelectorAll('[data-maphi]').forEach(s => s.onchange = () => { UI.map[UI.emp + s.dataset.maphi] = { hi: +s.value }; render(); });
  document.querySelectorAll('[data-mapk]').forEach(s => s.onchange = () => { const st = UI.map[UI.emp + s.dataset.src]; if (s.value === '') delete st[s.dataset.mapk]; else st[s.dataset.mapk] = +s.value; });
  document.querySelectorAll('[data-mapok]').forEach(b => b.onclick = () => {
    const src = b.dataset.mapok, st = UI.map[UI.emp + src], t = TMP[UI.emp + src]; const m = {}; ['doc', 'nombre', 'neto', 'ing', 'desc'].forEach(k => { if (st[k] !== undefined) m[k] = st[k]; });
    if (m.doc === undefined || (m.neto === undefined && (m.ing === undefined || m.desc === undefined))) return toast('Indica la columna de documento y la de neto (o ingresos y descuentos).', 'bad');
    guardarRep(UI.emp, src, t.file, t.sheets[t.si].aoa, st.hi || 0, m, 'manual' + (t.sheets.length > 1 ? ', hoja «' + t.sheets[t.si].name + '»' : ''), t.sheets);
  });
  const cd = $('#chkDif'); if (cd) cd.onchange = ev => { UI.soloDif = ev.target.checked; render(); };
  const br = $('#bRep'); if (br) br.onclick = () => reporteValidacion(UI.emp);
  const aut = id => { const X = cruce(id); if (!X || !X.ok100) return toast('Solo se autoriza cuando el 100 % de los netos cuadra.', 'bad'); Store.save(id, { aprob: { fecha: nowTxt(), usuario: SES.nombre } }).then(ok => ok && toast('✓ Emisión autorizada: ' + EMP[id].nombre, 'ok')); };
  const bau = $('#bAut'); if (bau) bau.onclick = () => aut(UI.emp);
  document.querySelectorAll('[data-aut]').forEach(b => b.onclick = () => aut(b.dataset.aut));
  document.querySelectorAll('[data-reab]').forEach(b => b.onclick = () => Store.save(b.dataset.reab, { aprob: undefined }));
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { UI.tab = b.dataset.go; UI.emp = b.dataset.e; render(); });
  const rf = $('#bRefresh'); if (rf) rf.onclick = () => Store.load();
  const rs = $('#bReset'); if (rs) rs.onclick = () => $('#resetBox').classList.remove('hidden');
  const rn = $('#bResetNo'); if (rn) rn.onclick = () => $('#resetBox').classList.add('hidden');
  const ro = $('#bResetOk'); if (ro) ro.onclick = async () => { await Store.reset(); toast('Cierre de prueba reiniciado', 'ok'); render(); };
}
document.addEventListener('DOMContentLoaded', () => {
  $('#selLang').onchange = ev => { lang = ev.target.value; render(); };
  $('#bSalir').onclick = () => { cerrarSesion(); lang = 'es'; $('#selLang').value = 'es'; render(); };
  document.querySelectorAll('#nav [data-tab]').forEach(b => b.onclick = () => { UI.tab = b.dataset.tab; render(); });
  if (SES && SES.emp) { lang = EMP[SES.emp].idioma; $('#selLang').value = lang; }
  render(); Store.init();
});
window.__t = { cruce, validarNov, Store, comprobantes, get UI() { return UI; } };
</script>
</body></html>
